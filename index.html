<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Simulador interactivo para analizar escenarios hipotéticos de homicidios en México (2000-2026)" />
    <meta name="keywords" content="México, homicidios, simulación, what-if, datos, INEGI, SESNSP" />
    <meta name="author" content="Kuautli" />
    <title>México: Simulador de Escenarios de Seguridad</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
      }

      #app {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div style="padding: 2rem; text-align: center">
        <h1 style="color: #333; margin-bottom: 0.5rem">
          🌑 México: Simulador de Escenarios de Seguridad
        </h1>
        <p style="color: #666; margin-bottom: 2rem">Cargando simulador...</p>
        <div
          style="
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
          "
        ></div>
      </div>
    </div>

    <style>
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
