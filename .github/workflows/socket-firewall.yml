name: Socket Firewall Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  socket-check:
    name: Socket Firewall check
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # No `version` here on purpose: pnpm/action-setup reads `packageManager`
      # from package.json, so this gate can never drift out of sync again.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install dependencies through Socket Firewall
        id: sfw-install
        run: sfw pnpm install --frozen-lockfile
        continue-on-error: true

      - name: Close PR — Socket Firewall flagged a dependency
        if: steps.sfw-install.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "🚫 Socket Firewall blocked the dependency install for this PR — at least one package was flagged as malicious. Closing automatically to keep it from becoming mergeable. If this looks like a false positive, investigate the Socket Firewall output above and reopen manually."
          gh pr close "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"

      - name: Fail the job when a dependency was flagged
        if: steps.sfw-install.outcome == 'failure'
        run: exit 1
